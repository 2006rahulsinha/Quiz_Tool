
services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend
    volumes:
      # Mount source code for hot reload in development
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    networks:
      - quiz-network
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - FRONTEND_ORIGIN=http://localhost:3000
    volumes:
      # Mount source code for hot reload in development
      - ./backend:/code
    networks:
      - quiz-network
  # Uncomment to add database
  # depends_on:
